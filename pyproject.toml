[project]
name = "schemafi"
version = "0.1.0"
description = "Document your schema whenever you change it!"
readme = "README.md"
authors = [{ name = "Mat", email = "mat@chabros.dev" }]
requires-python = "==3.12.11"
dependencies = []

[project.scripts]
schemafi = "schemafi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-json-report>=1.5.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
