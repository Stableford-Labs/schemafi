name: Ruff, mypy on Changed Python Files

on:
  workflow_call:
    inputs:
      changed_files:
        required: true
        type: string

jobs:
  ruff-isort-mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Uv sync
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff Check
        run: |
          echo "Running Ruff check on changed files: ${{ inputs.changed_files }}"
          uv run ruff check ${{ inputs.changed_files }} --config pyproject.toml --verbose

      - name: Run Ruff Format
        run: |
          echo "Running Ruff format check on changed files: ${{ inputs.changed_files }}"
          uv run ruff format --check ${{ inputs.changed_files }}

      - name: Run Mypy
        run: |
          echo "Running mypy on changed files: ${{ inputs.changed_files }}"
          uv run mypy ${{ inputs.changed_files }} --config-file pyproject.toml
