name: Ruff, mypy on Changed Python Files

on:
  workflow_call:
    inputs:
      changed_files:
        required: true
        type: string

jobs:
  ruff-isort-mypy:
    runs-on: ubuntu-latest
    outputs:
      ruff_format: ${{ steps.outcomes.outputs.ruff_format }}
      ruff_check: ${{ steps.outcomes.outputs.ruff_check }}
      mypy_check: ${{ steps.outcomes.outputs.mypy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Uv sync
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff Check
        id: ruff_check
        run: |
          echo "Running Ruff check on changed files: ${{ inputs.changed_files }}"
          uv run ruff check ${{ inputs.changed_files }} --config pyproject.toml --verbose 2>&1 | tee ruff_check_output.txt
        continue-on-error: true

      - name: Run Ruff Format
        id: ruff_format
        run: |
          echo "Running Ruff format check on changed files: ${{ inputs.changed_files }}"
          uv run ruff format --check ${{ inputs.changed_files }} 2>&1 | tee ruff_format_output.txt
        continue-on-error: true

      - name: Run Mypy
        id: mypy_check
        run: |
          echo "Running mypy on changed files: ${{ inputs.changed_files }}"
          uv run mypy ${{ inputs.changed_files }} --config-file pyproject.toml 2>&1 | tee mypy_output.txt
        continue-on-error: true

      - name: Upload Linting Results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            ruff_format_output.txt
            ruff_check_output.txt
            mypy_output.txt

      - name: Set tool outcomes
        id: outcomes
        run: |
          echo "ruff_format=${{ steps.ruff_format.outcome }}" >> $GITHUB_OUTPUT
          echo "ruff_check=${{ steps.ruff_check.outcome }}"   >> $GITHUB_OUTPUT
          echo "mypy=${{ steps.mypy_check.outcome }}"         >> $GITHUB_OUTPUT

      - name: Fail if any lint errors
        if: |
          steps.ruff_format.outcome == 'failure' ||
          steps.ruff_check.outcome  == 'failure' ||
          steps.mypy_check.outcome  == 'failure'
        run: exit 1

  notify:
    name: Chat Notification
    runs-on: ubuntu-latest
    needs: [ruff-isort-mypy]
    if: always()
    steps:
      - name: Set status metadata
        id: status
        run: |
          if [ "${{ needs.ruff-isort-mypy.result }}" == "success" ]; then
            echo "color=3066993"        >> $GITHUB_OUTPUT
            echo "status=✅ Ruff/Mypy passed" >> $GITHUB_OUTPUT
          else
            echo "color=15158332"       >> $GITHUB_OUTPUT
            echo "status=❌ Ruff/Mypy failed" >> $GITHUB_OUTPUT
          fi

      - name: Resolve tool outcomes
        id: tools
        run: |
          format_outcome="${{ needs.ruff-isort-mypy.outputs.ruff_format }}"
          check_outcome="${{ needs.ruff-isort-mypy.outputs.ruff_check }}"
          mypy_outcome="${{ needs.ruff-isort-mypy.outputs.mypy_check }}"

          format_icon=$([ "$format_outcome" == "success" ] && echo "✅" || echo "❌")
          check_icon=$([ "$check_outcome"   == "success" ] && echo "✅" || echo "❌")
          mypy_icon=$([ "$mypy_outcome"     == "success" ] && echo "✅" || echo "❌")

          echo "ruff_format=${format_icon} ${format_outcome}" >> $GITHUB_OUTPUT
          echo "ruff_check=${check_icon} ${check_outcome}"    >> $GITHUB_OUTPUT
          echo "mypy=${mypy_icon} ${mypy_outcome}"            >> $GITHUB_OUTPUT

      - name: Send CHat notification
        env:
          LINT_TEST_NOTIFICATION: ${{ secrets.LINT_TEST_NOTIFICATION }}
        run: |
          curl -s -X POST "$LINT_TEST_NOTIFICATION" \
            -H "Content-Type: application/json" \
            -d '{
              "username": "GitHub Lint Bot",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "embeds": [{
                "title": "${{ steps.status.outputs.status }} — ${{ github.repository }}",
                "description": "**Branch:** `${{ github.ref_name }}`\n**Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n**Author:** ${{ github.actor }}",
                "color": ${{ steps.status.outputs.color }},
                "fields": [
                  {
                    "name": "ruff format",
                    "value": "${{ steps.tools.outputs.ruff_format }}",
                    "inline": true
                  },
                  {
                    "name": "ruff check",
                    "value": "${{ steps.tools.outputs.ruff_check }}",
                    "inline": true
                  },
                  {
                    "name": "mypy check",
                    "value": "${{ steps.tools.outputs.mypy }}",
                    "inline": true
                  },
                  {
                    "name": "Lint results",
                    "value": "[View artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                    "inline": false
                  }
                ],
                "footer": { "text": "Run #${{ github.run_number }}" },
                "timestamp": "${{ github.event.head_commit.timestamp }}"
              }]
            }'
