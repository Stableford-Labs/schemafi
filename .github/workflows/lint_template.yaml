name: Ruff, mypy on Changed Python Files

on:
  workflow_call:
    inputs:
      changed_files:
        required: true
        type: string

jobs:
  ruff-isort-mypy:
    runs-on: ubuntu-latest
    outputs:
      ruff_format: ${{ steps.outcomes.outputs.ruff_format }}
      ruff_check: ${{ steps.outcomes.outputs.ruff_check }}
      mypy_check: ${{ steps.outcomes.outputs.mypy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Uv sync
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff Check
        id: ruff_check
        run: |
          echo "Running Ruff check on changed files: ${{ inputs.changed_files }}"
          uv run ruff check ${{ inputs.changed_files }} --config pyproject.toml --verbose 2>&1 | tee ruff_check_output.txt
        continue-on-error: true

      - name: Run Ruff Format
        id: ruff_format
        run: |
          echo "Running Ruff format check on changed files: ${{ inputs.changed_files }}"
          uv run ruff format --check ${{ inputs.changed_files }} 2>&1 | tee ruff_format_output.txt
        continue-on-error: true

      - name: Run Mypy
        id: mypy_check
        run: |
          echo "Running mypy on changed files: ${{ inputs.changed_files }}"
          uv run mypy ${{ inputs.changed_files }} --config-file pyproject.toml 2>&1 | tee mypy_output.txt
        continue-on-error: true

      - name: Upload Linting Results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            ruff_format_output.txt
            ruff_check_output.txt
            mypy_output.txt

      - name: Set tool outcomes
        id: outcomes
        run: |
          echo "ruff_format=${{ steps.ruff_format.outcome }}" >> $GITHUB_OUTPUT
          echo "ruff_check=${{ steps.ruff_check.outcome }}"   >> $GITHUB_OUTPUT
          echo "mypy_check=${{ steps.mypy_check.outcome }}"   >> $GITHUB_OUTPUT

      - name: Fail if any lint errors
        if: |
          steps.ruff_format.outcome == 'failure' ||
          steps.ruff_check.outcome  == 'failure' ||
          steps.mypy_check.outcome  == 'failure'
        run: exit 1

  notify:
    name: chat-notification
    runs-on: ubuntu-latest
    needs: [ruff-isort-mypy]
    if: always()
    steps:
      - name: set-status-metadata
        id: status
        run: |
          if [ "${{ needs.ruff-isort-mypy.result }}" == "success" ]; then
            echo "color=3066993"        >> $GITHUB_OUTPUT
            echo "status=✅ Ruff/Mypy passed" >> $GITHUB_OUTPUT
          else
            echo "color=15158332"       >> $GITHUB_OUTPUT
            echo "status=❌ Ruff/Mypy failed" >> $GITHUB_OUTPUT
          fi

      - name: resolve-tool-outcomes
        id: tools
        run: |
          format_outcome="${{ needs.ruff-isort-mypy.outputs.ruff_format }}"
          check_outcome="${{ needs.ruff-isort-mypy.outputs.ruff_check }}"
          mypy_outcome="${{ needs.ruff-isort-mypy.outputs.mypy_check }}"

          format_icon=$([ "$format_outcome" == "success" ] && echo "✅" || echo "❌")
          check_icon=$([ "$check_outcome"   == "success" ] && echo "✅" || echo "❌")
          mypy_icon=$([ "$mypy_outcome"     == "success" ] && echo "✅" || echo "❌")

          echo "ruff_format=${format_icon} ${format_outcome}" >> $GITHUB_OUTPUT
          echo "ruff_check=${check_icon} ${check_outcome}"    >> $GITHUB_OUTPUT
          echo "mypy_check=${mypy_icon} ${mypy_outcome}"            >> $GITHUB_OUTPUT

      - name: send-chat-notification
        env:
          URL: ${{ secrets.LINT_TEST_NOTIFICATION }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          STATUS: ${{ steps.status.outputs.status }}
          COLOR: ${{ steps.status.outputs.color }}
          RUFF_FORMAT: ${{ steps.tools.outputs.ruff_format }}
          RUFF_CHECK: ${{ steps.tools.outputs.ruff_check }}
          MYPY_CHECK: ${{ steps.tools.outputs.mypy_check }}
        run: |
          cat > /tmp/msg_payload.jq << 'EOF'
          {
            username: "GitHub Lint Bot",
            avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            embeds: [{
              title: "\($status) — \($repository)",
              description: "**Branch:** `\($ref_name)`\n**Commit:** [`\($sha)`](\($server_url)/\($repository)/commit/\($sha))\n**Author:** \($actor)",
              color: ($color | tonumber),
              fields: [
                { name: "ruff format", value: $ruff_format, inline: true },
                { name: "ruff check",  value: $ruff_check,  inline: true },
                { name: "mypy check",  value: $mypy_check,  inline: true },
                {
                  name: "Lint results",
                  value: "[View artifact](\($server_url)/\($repository)/actions/runs/\($run_id))",
                  inline: false
                }
              ],
              footer: { text: "Run #\($run_number)" },
              timestamp: $timestamp
            }]
          }
          EOF

          payload=$(jq -n \
            --arg status      "$STATUS" \
            --arg repository  "$REPOSITORY" \
            --arg ref_name    "$REF_NAME" \
            --arg sha         "$SHA" \
            --arg server_url  "$SERVER_URL" \
            --arg actor       "$ACTOR" \
            --arg run_id      "$RUN_ID" \
            --arg run_number  "$RUN_NUMBER" \
            --arg timestamp   "$TIMESTAMP" \
            --arg ruff_format "$RUFF_FORMAT" \
            --arg ruff_check  "$RUFF_CHECK" \
            --arg mypy_check  "$MYPY_CHECK" \
            --arg color       "$COLOR" \
            -f /tmp/msg_payload.jq)

          echo "jq exit: $jq_exit"
          echo "payload: $payload"
          cat /tmp/msg_payload.jq

          jq_exit=$?

          if [ -z "$payload" ] || [ "$jq_exit" -ne 0 ]; then
            echo "jq failed to build payload"
            exit 1
          fi

          curl -s \
            -o /tmp/msg_body.txt \
            -w "%{http_code}" \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$payload" > /tmp/msg_code.txt

          http_code=$(cat /tmp/msg_code.txt)
          body=$(cat /tmp/msg_body.txt)

          echo "Res code: $http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -gt 299 ]; then
            echo "Webhook failed with HTTP $http_code"
            [ -n "$body" ] && echo "Response body: $body"
            exit 1
          fi
