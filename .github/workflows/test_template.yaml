name: Run Pytests

on:
  workflow_call:
    secrets:
      LINT_TEST_NOTIFICATION:
        required: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.outcomes.outputs.passed }}
      failed: ${{ steps.outcomes.outputs.failed }}
      errors: ${{ steps.outcomes.outputs.errors }}
      total: ${{ steps.outcomes.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Uv sync
        id: uv_sync
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        id: unit_tests
        run: |
          uv run pytest ./tests -v \
          --json-report \
          --json-report-file=/tmp/unit_tests_report.json \
          -v 2>&1 | tee unit_tests_output.txt
        continue-on-error: true

      - name: Upload pytest results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            unit_tests_output.txt
            /tmp/unit_tests_report.json

      - name: Parse pytest results
        id: outcomes
        run: |
          passed=$(python3 -c "import json; r=json.load(open('/tmp/unit_tests_report.json')); print(r['summary'].get('passed', 0))")
          failed=$(python3 -c "import json; r=json.load(open('/tmp/unit_tests_report.json')); print(r['summary'].get('failed', 0))")
          errors=$(python3 -c "import json; r=json.load(open('/tmp/unit_tests_report.json')); print(r['summary'].get('error', 0))")
          total=$(python3  -c "import json; r=json.load(open('/tmp/unit_tests_report.json')); print(r['summary'].get('total', 0))")

          echo "passed=$passed" >> $GITHUB_OUTPUT
          echo "failed=$failed" >> $GITHUB_OUTPUT
          echo "errors=$errors" >> $GITHUB_OUTPUT
          echo "total=$total"   >> $GITHUB_OUTPUT

      - name: Fail if any tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

  notify:
    name: chat-notification
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - name: set-status-metadata
        id: status
        run: |
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "color=3066993"             >> $GITHUB_OUTPUT
            echo "status=✅ Pytest passed"   >> $GITHUB_OUTPUT
          else
            echo "color=15158332"             >> $GITHUB_OUTPUT
            echo "status=❌ Pytest failed"    >> $GITHUB_OUTPUT
          fi

      - name: resolve-test-outcomes
        id: tools
        run: |
          passed="${{ needs.unit-tests.outputs.passed }}"
          failed="${{ needs.unit-tests.outputs.failed }}"
          errors="${{ needs.unit-tests.outputs.errors }}"
          total="${{ needs.unit-tests.outputs.total }}"

          echo "passed=${passed:-0}" >> $GITHUB_OUTPUT
          echo "failed=${failed:-0}" >> $GITHUB_OUTPUT
          echo "errors=${errors:-0}" >> $GITHUB_OUTPUT
          echo "total=${total:-0}"   >> $GITHUB_OUTPUT

      - name: send-chat-notification
        env:
          URL: ${{ secrets.LINT_TEST_NOTIFICATION }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          STATUS: ${{ steps.status.outputs.status }}
          COLOR: ${{ steps.status.outputs.color }}
          PASSED: ${{ steps.tools.outputs.passed }}
          FAILED: ${{ steps.tools.outputs.failed }}
          ERRORS: ${{ steps.tools.outputs.errors }}
          TOTAL: ${{ steps.tools.outputs.total }}
        run: |
          if [ -z "$URL" ]; then
            echo "URL is empty — secret not resolved"
            exit 1
          fi

          cat > /tmp/msg_payload.jq << 'EOF'
          {
            username: "GitHub Test Bot",
            avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            embeds: [{
              title: "\($status) — \($repository)",
              description: "**Branch:** `\($ref_name)`\n**Commit:** [`\($sha)`](\($server_url)/\($repository)/commit/\($sha))\n**Author:** \($actor)",
              color: ($color | tonumber),
              fields: [
                { name: "✅ Passed", value: $passed, inline: true },
                { name: "❌ Failed", value: $failed, inline: true },
                { name: "⚠️ Errors", value: $errors, inline: true },
                { name: "Total",     value: $total,  inline: true },
                {
                  name: "Test results",
                  value: "[View artifact](\($server_url)/\($repository)/actions/runs/\($run_id))",
                  inline: false
                }
              ],
              footer: { text: "Run #\($run_number)" }
            } + (if $timestamp != "" then { timestamp: $timestamp } else {} end)]
          }
          EOF

          payload=$(jq -n \
            --arg status     "$STATUS" \
            --arg repository "$REPOSITORY" \
            --arg ref_name   "$REF_NAME" \
            --arg sha        "$SHA" \
            --arg server_url "$SERVER_URL" \
            --arg actor      "$ACTOR" \
            --arg run_id     "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg timestamp  "$TIMESTAMP" \
            --arg passed     "$PASSED" \
            --arg failed     "$FAILED" \
            --arg errors     "$ERRORS" \
            --arg total      "$TOTAL" \
            --arg color      "$COLOR" \
            -f /tmp/msg_payload.jq)

          jq_exit=$?

          if [ -z "$payload" ] || [ "$jq_exit" -ne 0 ]; then
            echo "jq failed to build payload"
            exit 1
          fi

          http_code=$(curl -s \
            -o /tmp/msg_body.txt \
            -w "%{http_code}" \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$payload")

          body=$(cat /tmp/msg_body.txt)

          if [ "$http_code" -lt 200 ] || [ "$http_code" -gt 299 ]; then
            echo "Webhook failed with HTTP $http_code"
            [ -n "$body" ] && echo "Res body: $body"
            exit 1
          fi
