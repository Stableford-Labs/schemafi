repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v5.0.0
        hooks:
        -   id: trailing-whitespace
            name: Trim Trailing Whitespace
            description: This hook trims trailing whitespace.
        -   id: end-of-file-fixer
            name: Add a newline, and only a newline
            description: Makes sure files end in a newline and only a newline.
        -   id: check-yaml
            name: Check yaml correctness
        -   id: check-added-large-files
            name: Check if no large files to be committed
        -   id: debug-statements
            name: Check for debug statements
            description: Checks for debugger imports and py37+ breakpoint() calls in python source
        -   id: check-merge-conflict
            name: Check for merge conflict messages
            description: Checks for merge conflict messages left in committed files

    -   repo: https://github.com/charliermarsh/ruff-pre-commit
        rev: v0.15.5
        hooks:
        -   id: ruff-format
            name: Run ruff formatter
            description: Formats quietly whitespaces, newline breaks etc.

    -   repo: https://github.com/charliermarsh/ruff-pre-commit
        rev: v0.15.5
        hooks:
        -   id: ruff-check
            name: Run ruff linter
            description: Lints the committed files.

    -   repo: https://github.com/pre-commit/mirrors-mypy
        rev: v1.15.0
        hooks:
        -   id: mypy
            name: Run mypy
            additional_dependencies: [types-requests, types-PyYAML]
            args: [--ignore-missing-imports, --disallow-untyped-defs]

    -   repo: local
        hooks:
        -   id: pytest
            name: Run pytest
            entry: pytest
            language: system
            pass_filenames: false
            always_run: true
            args: ["-xvs", "tests/"]
